case_id: case_001
ct_path: ../data/case_001/ct.nrrd
# CT 为多序列 DICOM 目录时必须指定目标序列，避免误用 scout 或不同层厚重建。
# dicom_series_uid: 1.2.840.example
output_root: ../output

# 这些网格由 scripts/preprocess_manual_segmentation_case.py 从手工 .seg.nrrd 生成。
organ_models:
  adrenal_gland_left: ../data/case_001/prepared/models/adrenal_gland_left.ply
  adrenal_gland_right: ../data/case_001/prepared/models/adrenal_gland_right.ply
  aorta: ../data/case_001/prepared/models/aorta.ply
  duodenum: ../data/case_001/prepared/models/duodenum.ply
  esophagus: ../data/case_001/prepared/models/esophagus.ply
  gallbladder: ../data/case_001/prepared/models/gallbladder.ply
  inferior_vena_cava: ../data/case_001/prepared/models/inferior_vena_cava.ply
  kidney_left: ../data/case_001/prepared/models/kidney_left.ply
  kidney_right: ../data/case_001/prepared/models/kidney_right.ply
  liver: ../data/case_001/prepared/models/liver.ply
  pancreas: ../data/case_001/prepared/models/pancreas.ply
  portal_vein_and_splenic_vein: ../data/case_001/prepared/models/portal_vein_and_splenic_vein.ply
  spleen: ../data/case_001/prepared/models/spleen.ply
  stomach: ../data/case_001/prepared/models/stomach.ply

# 原重建血管继续独立决定 features、Gallery 状态和原血管边界图。
vessel_models:
  - id: artery_tree
    path: ../data/case_001/artery_tree.ply
    label: artery
    color: [255, 82, 0]
  - id: vein_tree
    path: ../data/case_001/vein_tree.ply
    label: vein
    color: [0, 188, 212]

manual_segmentation:
  path: ../data/case_001/prepared/segmentation/EUS-main-organ.seg.nrrd
  organ_label_values:
    adrenal_gland_left: [13]
    adrenal_gland_right: [12]
    aorta: [8]
    duodenum: [14]
    esophagus: [5]
    gallbladder: [4]
    inferior_vena_cava: [9]
    kidney_left: [3]
    kidney_right: [2]
    liver: [6]
    pancreas: [11]
    portal_vein: [23, 26, 33, 34, 35, 36, 37]
    spleen: [1]
    stomach: [7]
  eus_vessel_label_values:
    aorta: [8]
    inferior_vena_cava: [9]
    portal_vein: [26, 33, 34, 35, 36, 37]
  eus_vessel_colors:
    aorta: [255, 0, 0]
    inferior_vena_cava: [0, 0, 255]
    portal_vein: [170, 85, 255]

geometry:
  input_coordinate_system: LPS
  canonical_coordinate_system: RAS

sampling:
  point_counts:
    stomach: 1000
    liver: 500
    pancreas: 500
    duodenum_part1: 500
    duodenum_part2: 500
    esophagus: 200
  ray_length_mm: 100.0
  ray_batch_size: 2048
  minimum_spacing_mm: 10.0
  centerline_voxel_pitch_mm: 1.0
  centerline_tangent_window_mm: 10.0
  centerline_max_terminal_spur_mm: 5.0
  # 病例骨架必须经解剖确认后才可填写以下 RAS mm 端点，不可跨病例复制。
  # duodenum_centerline_endpoint_hints_ras_mm:
  #   proximal: [0.0, 0.0, 0.0]
  #   distal: [0.0, 0.0, 0.0]
  # duodenum_centerline_endpoint_match_tolerance_mm: 1.0

square:
  side_length_mm: 100.0

ct:
  output_resolution: 300
  window_level: 40.0
  window_width: 400.0
  fill_hu_value: -1000.0

filtering:
  black_threshold: 50
  black_ratio_limit: 0.60
  line_min_diagonal_fraction: 0.70
  black_side_min_ratio: 0.90
  valid_side_max_black_ratio: 0.10

runtime:
  seed: 0
  workers: 4
  backend: auto
  gpu_device: 0
  gpu_batch_size: 8

# 自动病例入口：病例影像输入只有 CT 与一份可混合包含器官、血管标签的标签体。
case_id: case_001
ct_path: ../data/case_001/ct.nrrd
vascular_segmentation_path: ../data/case_001/labels.nrrd

# 只提取这里配置的动静脉标签，标签体中的其他标签全部忽略。
# 旧配置可额外提供 portal，其标签会自动并入 vein。
vessel_label_values:
  artery: [1]
  vein: [2, 3]

# 既有检索引擎代码依赖，不属于病例影像输入。
registration_module_path: ../registration/2021.py
output_root: ../output

# 当 ct_path 为含多个序列的 DICOM 目录时必须填写。
dicom_series_uid: null

totalsegmentator:
  executable: TotalSegmentator
  device: gpu:0
  # 自动流程要求 14 个通用结构：原 11 类器官加腹主动脉、下腔静脉、门静脉。
  # 胆囊保留；胆管不进入器官元数据。门静脉使用 TotalSegmentator 的组合掩膜。
  # 可选；相对路径按本配置文件目录解析。缓存无效时会在此目录重新生成。
  # cache_directory: ../cache/case_001/totalsegmentator
